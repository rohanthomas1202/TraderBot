# Kalshi Market Mapping — Shadow Mode (real data, paper trading)
#
# Maps Kalshi tickers to internal market IDs used by the strategy
# and risk engines. Update tickers as Kalshi events change.
#
# Prices are automatically converted from Kalshi dollar strings to
# internal microdollars (10^-6 USD).

markets:
  - kalshi_ticker: "KXATPMATCH-26MAR17HANVAN-VAN"
    internal_id: "KALSHI-ATP-HANVAN"
    display_name: "ATP Miami: Van de Zandschulp wins"
    enabled: true

  - kalshi_ticker: "KXATPMATCH-26MAR17HANVAN-HAN"
    internal_id: "KALSHI-ATP-HANVAN-HAN"
    display_name: "ATP Miami: Haneishi wins"
    enabled: true

  - kalshi_ticker: "KXWTAMATCH-26MAR17ZAKSRA-ZAK"
    internal_id: "KALSHI-WTA-ZAKSRA"
    display_name: "WTA Miami: Zakharova wins"
    enabled: true

# Polling interval for market fetches (milliseconds).
poll_interval_ms: 2000

# API base URL.
api_base_url: "https://api.elections.kalshi.com/trade-api/v2"
