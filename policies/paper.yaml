# Paper Trading Policy — Phase 1
# All limits are deliberately generous for paper trading.
# The purpose of Phase 1 is to validate the control flow, not tune limits.
# Production limits will be 10-100x tighter.

mode: paper

execution:
  transmit_orders: true          # transmit to mock exchange (not real)
  require_signed_approval: true  # HMAC approval required even in paper mode
  require_heartbeat: true        # watchdog heartbeat required

allowed_markets:
  # In paper mode, all markets from the mock exchange are allowed.
  # Use glob pattern "*" to match any market ID.
  mock:
    - "*"
  kalshi:
    - "*"

per_trade:
  max_notional_micros: 10000000000     # $10,000
  max_quantity: 1000
  min_price_micros: 10000              # $0.01
  max_price_micros: 990000             # $0.99
  max_spread_bps: 1000                 # 10%

per_position:
  max_notional_micros: 50000000000     # $50,000
  max_quantity: 5000
  max_concentration_pct: 25.0

per_strategy:
  max_daily_loss_micros: 5000000000    # $5,000
  max_daily_turnover_micros: 50000000000  # $50,000
  max_orders_per_minute: 10
  max_consecutive_losses: 10
  max_open_orders: 20

per_venue:
  mock:
    max_exposure_micros: 100000000000  # $100,000
    max_daily_loss_micros: 50000000000 # $50,000
  kalshi:
    max_exposure_micros: 100000000000  # $100,000 (shadow mode — same as mock)
    max_daily_loss_micros: 50000000000 # $50,000

global:
  max_total_exposure_micros: 100000000000  # $100,000
  max_daily_loss_micros: 50000000000       # $50,000
  max_drawdown_from_peak_pct: 15.0
  trading_hours_utc_start: "00:00"
  trading_hours_utc_end: "23:59"

data_quality:
  max_data_age_seconds: 5
  min_orderbook_depth: 1

kill_switch_triggers:
  global_daily_loss_micros: 50000000000     # $50,000
  global_drawdown_pct: 15.0
  venue_daily_loss_micros: 50000000000      # $50,000
  strategy_daily_loss_micros: 5000000000    # $5,000
  strategy_consecutive_losses: 10
  heartbeat_timeout_seconds: 30
