syntax = "proto3";
package watchdog;
option go_package = "autonomy-platform/gen/watchdogpb";

import "google/protobuf/timestamp.proto";

service Watchdog {
  // Trigger a kill switch at the specified level and scope.
  rpc TriggerKillSwitch(KillSwitchRequest) returns (KillSwitchResponse);

  // Get current system status and active halts.
  rpc GetSystemStatus(SystemStatusRequest) returns (SystemStatus);

  // Acknowledge a halt (required before trading can resume).
  rpc AcknowledgeHalt(AcknowledgeHaltRequest) returns (AcknowledgeHaltResponse);

  // Resume trading after an acknowledged halt.
  rpc ResumeTrading(ResumeTradingRequest) returns (ResumeTradingResponse);

  // Services report heartbeats to the watchdog.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// ─── Kill Switch ───

enum KillSwitchLevel {
  KILL_LEVEL_UNSPECIFIED = 0;
  KILL_LEVEL_SOFT_PAUSE = 1;     // stop new orders, keep existing
  KILL_LEVEL_CANCEL_ONLY = 2;    // cancel all open orders
  KILL_LEVEL_FULL_STOP = 3;      // cancel all, revoke signing (Phase 3+)
  // FLATTEN deferred to Phase 3
}

message KillSwitchRequest {
  KillSwitchLevel level = 1;
  string scope = 2;              // "global", "venue:mock", "strategy:momentum-v1"
  string reason = 3;
  string triggered_by = 4;      // service name or operator identity
}

message KillSwitchResponse {
  bool executed = 1;
  string detail = 2;
}

// ─── System Status ───

message SystemStatusRequest {}

message SystemStatus {
  string current_mode = 1;      // "normal", "soft_pause", "cancel_only", "full_stop"
  repeated ActiveHalt active_halts = 2;
  map<string, ServiceHealth> service_health = 3;
  google.protobuf.Timestamp as_of = 4;
}

message ActiveHalt {
  KillSwitchLevel level = 1;
  string scope = 2;
  string reason = 3;
  string triggered_by = 4;
  google.protobuf.Timestamp triggered_at = 5;
  bool acknowledged = 6;
  string acknowledged_by = 7;
  google.protobuf.Timestamp acknowledged_at = 8;
}

message ServiceHealth {
  string service_name = 1;
  bool healthy = 2;
  google.protobuf.Timestamp last_heartbeat = 3;
  string detail = 4;
}

// ─── Acknowledge & Resume ───

message AcknowledgeHaltRequest {
  string scope = 1;             // must match an active halt
  string acknowledged_by = 2;   // operator identity
  string root_cause = 3;        // required: operator must state the cause
}

message AcknowledgeHaltResponse {
  bool success = 1;
  string detail = 2;
}

message ResumeTradingRequest {
  string scope = 1;
  string resumed_by = 2;
}

message ResumeTradingResponse {
  bool success = 1;
  string detail = 2;
}

// ─── Heartbeat ───

message HeartbeatRequest {
  string service_name = 1;
  string status = 2;            // "healthy", "degraded"
  string detail = 3;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  string system_mode = 2;       // tell the service what mode we're in
}
