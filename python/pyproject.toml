[project]
name = "autonomy-intelligence"
version = "0.1.0"
description = "Prediction market forecasting models, data ingestion, and backtesting"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.31",
    "cfgrib>=0.9.12",
    "xarray>=2024.1",
    "eccodes>=1.7",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "nats-py>=2.7",
    "matplotlib>=3.8",
    "schedule>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["collectors*", "models*", "backtesting*", "market_logger*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
